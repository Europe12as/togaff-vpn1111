<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TOGAFF VPN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap');

  :root {
    --bg:       #000000;
    --bg2:      #0a0a0a;
    --bg3:      #111111;
    --border:   #2a2a2a;
    --border2:  #3a3a3a;
    --text:     #e8e8e8;
    --dim:      #666666;
    --dim2:     #444444;
    --accent:   #ffffff;
    --mono:     'Share Tech Mono', monospace;
    --sans:     'Rajdhani', sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.015) 2px,
      rgba(255,255,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* Noise texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 99;
  }

  .app {
    max-width: 420px;
    margin: 0 auto;
    padding: 0 0 40px;
    position: relative;
    z-index: 1;
  }

  /* в”Ђв”Ђ HEADER в”Ђв”Ђ */
  .header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }

  .header-logo {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .header-logo span {
    color: var(--dim);
  }

  .header-badge {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
    border: 1px solid var(--border2);
    padding: 3px 8px;
  }

  /* в”Ђв”Ђ STATUS CARD в”Ђв”Ђ */
  .status-card {
    margin: 20px 16px;
    border: 1px solid var(--border);
    background: var(--bg2);
    position: relative;
    overflow: hidden;
  }

  .status-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.5s;
  }

  .status-card.connected::before { opacity: 0.4; }

  .status-card-inner {
    padding: 24px;
  }

  .status-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--dim);
    margin-bottom: 12px;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border: 1px solid var(--dim2);
    background: transparent;
    flex-shrink: 0;
    transition: all 0.4s;
    position: relative;
  }

  .status-dot.active {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(255,255,255,0.5);
  }

  .status-dot.active::after {
    content: '';
    position: absolute;
    inset: -4px;
    border: 1px solid rgba(255,255,255,0.2);
    animation: pulse-ring 2s infinite;
  }

  @keyframes pulse-ring {
    0%   { opacity:0.6; transform:scale(1); }
    100% { opacity:0; transform:scale(1.8); }
  }

  .status-text {
    font-family: var(--sans);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent);
    transition: color 0.4s;
  }

  .status-text.offline { color: var(--dim); }

  .status-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border-top: 1px solid var(--border);
    margin-top: 16px;
  }

  .meta-item {
    background: var(--bg);
    padding: 12px 14px;
  }

  .meta-key {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim);
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .meta-val {
    font-size: 12px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .meta-val.loading {
    color: var(--dim);
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%,100% { opacity:1; }
    50%      { opacity:0.3; }
  }

  /* в”Ђв”Ђ BIG BUTTON в”Ђв”Ђ */
  .btn-connect-wrap {
    padding: 4px 16px 0;
  }

  .btn-connect {
    width: 100%;
    padding: 18px;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
    outline: none;
  }

  .btn-connect::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    transform: translateX(-101%);
    transition: transform 0.25s ease;
    z-index: 0;
  }

  .btn-connect:active::before { transform: translateX(0); }
  .btn-connect:active { color: var(--bg); }

  .btn-connect span { position: relative; z-index: 1; }

  .btn-connect.disconnect-btn {
    border-color: var(--dim2);
    color: var(--dim);
  }

  .btn-connect.disconnect-btn::before { background: var(--dim2); }
  .btn-connect.disconnect-btn:active { color: var(--bg); }

  /* в”Ђв”Ђ CONTROLS ROW в”Ђв”Ђ */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    margin: 12px 16px 0;
    background: var(--border);
    border: 1px solid var(--border);
  }

  .ctrl-btn {
    background: var(--bg2);
    border: none;
    padding: 14px 8px;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    outline: none;
  }

  .ctrl-btn:active { background: var(--bg3); color: var(--text); }
  .ctrl-btn.active { color: var(--text); }

  .ctrl-icon {
    font-size: 16px;
    line-height: 1;
  }

  /* в”Ђв”Ђ SERVER LIST в”Ђв”Ђ */
  .section {
    margin: 20px 16px 0;
    border: 1px solid var(--border);
    background: var(--bg2);
  }

  .section-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .section-title {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
  }

  .section-count {
    font-size: 10px;
    color: var(--dim2);
  }

  .server-list { max-height: 220px; overflow-y: auto; }

  .server-list::-webkit-scrollbar { width: 2px; }
  .server-list::-webkit-scrollbar-track { background: var(--bg); }
  .server-list::-webkit-scrollbar-thumb { background: var(--border2); }

  .server-item {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
    gap: 10px;
  }

  .server-item:last-child { border-bottom: none; }
  .server-item:active { background: var(--bg3); }
  .server-item.selected { background: var(--bg3); }

  .server-dot {
    width: 6px; height: 6px;
    flex-shrink: 0;
    background: var(--dim2);
  }

  .server-dot.fast  { background: var(--accent); }
  .server-dot.med   { background: #888; }
  .server-dot.slow  { background: var(--dim2); }
  .server-dot.dead  { background: transparent; border: 1px solid var(--dim2); }

  .server-host {
    flex: 1;
    font-size: 11px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .server-ping {
    font-size: 10px;
    color: var(--dim);
    flex-shrink: 0;
    min-width: 52px;
    text-align: right;
  }

  .server-active-mark {
    font-size: 9px;
    color: var(--dim);
    flex-shrink: 0;
  }

  /* в”Ђв”Ђ LOG в”Ђв”Ђ */
  .log-section {
    margin: 12px 16px 0;
    border: 1px solid var(--border);
    background: var(--bg);
  }

  .log-body {
    padding: 12px 14px;
    max-height: 120px;
    overflow-y: auto;
    font-size: 10px;
    line-height: 1.8;
    color: var(--dim);
  }

  .log-body::-webkit-scrollbar { width: 2px; }
  .log-body::-webkit-scrollbar-thumb { background: var(--border2); }

  .log-line { display: flex; gap: 8px; }
  .log-time { color: var(--dim2); flex-shrink: 0; }
  .log-msg.ok  { color: #aaa; }
  .log-msg.err { color: #555; }
  .log-msg.info{ color: var(--dim); }

  /* в”Ђв”Ђ ENCRYPTION STRIP в”Ђв”Ђ */
  .enc-strip {
    margin: 12px 16px 0;
    border: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg2);
  }

  .enc-items {
    display: flex;
    gap: 16px;
  }

  .enc-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--dim);
  }

  .enc-dot {
    width: 4px; height: 4px;
    background: var(--dim2);
  }

  .enc-dot.on { background: var(--accent); }

  /* в”Ђв”Ђ TIMER в”Ђв”Ђ */
  .timer-row {
    margin: 12px 16px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border: 1px solid var(--border);
    background: var(--bg2);
  }

  .timer-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim);
    flex: 1;
    text-transform: uppercase;
  }

  .timer-val {
    font-size: 16px;
    letter-spacing: 3px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* в”Ђв”Ђ SCROLLBAR HIDDEN в”Ђв”Ђ */
  body { scrollbar-width: none; }
  body::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-logo">TOGAFF<span> VPN</span></div>
    <div class="header-badge">v2.0</div>
  </div>

  <!-- STATUS CARD -->
  <div class="status-card" id="statusCard">
    <div class="status-card-inner">
      <div class="status-label">// CONNECTION STATUS</div>
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <div class="status-text offline" id="statusText">OFFLINE</div>
      </div>
    </div>
    <div class="status-meta">
      <div class="meta-item">
        <div class="meta-key">SERVER</div>
        <div class="meta-val" id="metaServer">вЂ”</div>
      </div>
      <div class="meta-item">
        <div class="meta-key">PING</div>
        <div class="meta-val" id="metaPing">вЂ”</div>
      </div>
      <div class="meta-item">
        <div class="meta-key">YOUR IP</div>
        <div class="meta-val" id="metaIp">вЂ”</div>
      </div>
      <div class="meta-item">
        <div class="meta-key">PROTOCOL</div>
        <div class="meta-val" id="metaProto">HTTP PROXY</div>
      </div>
    </div>
  </div>

  <!-- SESSION TIMER -->
  <div class="timer-row" id="timerRow" style="display:none">
    <div class="timer-label">SESSION</div>
    <div class="timer-val" id="timerVal">00:00:00</div>
  </div>

  <!-- MAIN BUTTON -->
  <div class="btn-connect-wrap">
    <button class="btn-connect" id="btnConnect" onclick="toggleConnect()">
      <span id="btnText">[ CONNECT ]</span>
    </button>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="ctrl-btn" id="btnRotate" onclick="rotateIP()" disabled>
      <span class="ctrl-icon">в†»</span>
      ROTATE IP
    </button>
    <button class="ctrl-btn" onclick="scanServers()">
      <span class="ctrl-icon">в–¤</span>
      SCAN
    </button>
    <button class="ctrl-btn" onclick="showMyIp()">
      <span class="ctrl-icon">в—Ћ</span>
      MY IP
    </button>
    <button class="ctrl-btn" onclick="clearLog()">
      <span class="ctrl-icon">вЉ </span>
      CLEAR LOG
    </button>
  </div>

  <!-- ENCRYPTION STRIP -->
  <div class="enc-strip">
    <div class="enc-items">
      <div class="enc-item"><div class="enc-dot on" id="encAes"></div> AES-256</div>
      <div class="enc-item"><div class="enc-dot" id="encDns"></div> DNS-HTTPS</div>
      <div class="enc-item"><div class="enc-dot" id="encLeak"></div> LEAK PROTECT</div>
    </div>
    <div style="font-size:9px;color:var(--dim2);letter-spacing:1px;" id="encStatus">STANDBY</div>
  </div>

  <!-- SERVER LIST -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">// SERVERS</div>
      <div class="section-count" id="serverCount">0 online</div>
    </div>
    <div class="server-list" id="serverList">
      <div class="server-item" style="justify-content:center;color:var(--dim2);font-size:10px;letter-spacing:2px;">
        PRESS SCAN
      </div>
    </div>
  </div>

  <!-- LOG -->
  <div class="log-section">
    <div class="section-header">
      <div class="section-title">// SYSTEM LOG</div>
    </div>
    <div class="log-body" id="logBody"></div>
  </div>

</div>

<script>
// в”Ђв”Ђ Telegram WebApp init в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#000000');
  tg.setBackgroundColor('#000000');
}

// в”Ђв”Ђ State в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
const SERVERS = [
  ["185.221.160.253",80], ["185.221.160.214",80],
  ["87.239.31.42",80],    ["109.197.153.121",8888],
  ["188.235.146.220",80], ["94.26.241.120",80],
  ["89.23.112.143",80],   ["91.222.238.112",80],
  ["82.208.111.19",8080], ["185.244.173.101",80],
  ["185.221.152.147",80], ["91.107.124.250",80],
  ["212.96.201.54",80],   ["5.180.241.126",80],
  ["195.91.179.91",80],   ["37.120.189.106",80],
  ["89.31.143.1",80],     ["78.47.138.199",80],
  ["89.31.143.2",80],     ["195.201.34.206",80],
];

let state = {
  connected: false,
  proxy: null,
  sessionStart: null,
  timerInterval: null,
  scanCache: [],
};

// в”Ђв”Ђ Log в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
function log(msg, type = 'info') {
  const now = new Date();
  const t = [now.getHours(), now.getMinutes(), now.getSeconds()]
    .map(x => String(x).padStart(2,'0')).join(':');
  const el = document.getElementById('logBody');
  const line = document.createElement('div');
  line.className = 'log-line';
  line.innerHTML = `<span class="log-time">${t}</span><span class="log-msg ${type}">${msg}</span>`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function clearLog() {
  document.getElementById('logBody').innerHTML = '';
  log('log cleared', 'info');
}

// в”Ђв”Ђ Timer в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
function startTimer() {
  state.sessionStart = Date.now();
  document.getElementById('timerRow').style.display = 'flex';
  state.timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - state.sessionStart) / 1000);
    const h = String(Math.floor(s/3600)).padStart(2,'0');
    const m = String(Math.floor((s%3600)/60)).padStart(2,'0');
    const sec = String(s%60).padStart(2,'0');
    document.getElementById('timerVal').textContent = `${h}:${m}:${sec}`;
  }, 1000);
}

function stopTimer() {
  clearInterval(state.timerInterval);
  document.getElementById('timerRow').style.display = 'none';
}

// в”Ђв”Ђ UI Update в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
function setConnected(proxy, ping) {
  state.connected = true;
  state.proxy = proxy;

  const card = document.getElementById('statusCard');
  card.classList.add('connected');

  document.getElementById('statusDot').classList.add('active');
  const txt = document.getElementById('statusText');
  txt.textContent = 'ONLINE';
  txt.classList.remove('offline');

  document.getElementById('metaServer').textContent = `${proxy[0]}:${proxy[1]}`;
  document.getElementById('metaPing').textContent   = ping ? `${ping}ms` : 'вЂ”';

  document.getElementById('btnText').textContent = '[ DISCONNECT ]';
  document.getElementById('btnConnect').classList.add('disconnect-btn');
  document.getElementById('btnRotate').disabled = false;

  document.getElementById('encDns').classList.add('on');
  document.getElementById('encLeak').classList.add('on');
  document.getElementById('encStatus').textContent = 'ACTIVE';

  startTimer();

  // Fetch IP via CORS proxy (only public IP, proxy not usable from browser)
  fetchMyIp();
}

function setDisconnected() {
  state.connected = false;
  state.proxy     = null;

  document.getElementById('statusCard').classList.remove('connected');
  document.getElementById('statusDot').classList.remove('active');
  const txt = document.getElementById('statusText');
  txt.textContent = 'OFFLINE';
  txt.classList.add('offline');

  document.getElementById('metaServer').textContent = 'вЂ”';
  document.getElementById('metaPing').textContent   = 'вЂ”';
  document.getElementById('metaIp').textContent     = 'вЂ”';

  document.getElementById('btnText').textContent = '[ CONNECT ]';
  document.getElementById('btnConnect').classList.remove('disconnect-btn');
  document.getElementById('btnRotate').disabled = true;

  document.getElementById('encDns').classList.remove('on');
  document.getElementById('encLeak').classList.remove('on');
  document.getElementById('encStatus').textContent = 'STANDBY';

  stopTimer();
}

// в”Ђв”Ђ Connect / Disconnect в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
async function toggleConnect() {
  if (state.connected) {
    log('disconnecting...', 'info');
    setDisconnected();
    log('connection terminated', 'ok');
    return;
  }

  const btn = document.getElementById('btnConnect');
  btn.disabled = true;
  document.getElementById('btnText').textContent = '[ SEARCHING... ]';
  log('scanning for best server...', 'info');

  // Try to find best server from cache or scan
  let best = null;
  if (state.scanCache.length > 0) {
    best = state.scanCache.find(s => s.ping !== null);
  }

  if (!best) {
    log('no scan cache вЂ” using first server', 'info');
    best = { host: SERVERS[0][0], port: SERVERS[0][1], ping: null };
  }

  log(`connecting to ${best.host}:${best.port}`, 'info');
  document.getElementById('btnText').textContent = '[ CONNECTING... ]';
  document.getElementById('metaServer').textContent = `${best.host}:${best.port}`;

  await sleep(800); // simulate handshake

  setConnected([best.host, best.port], best.ping);
  log(`connected в†’ ${best.host}:${best.port} [${best.ping ? best.ping+'ms' : 'n/a'}]`, 'ok');

  btn.disabled = false;
}

async function rotateIP() {
  if (!state.connected) return;
  log('rotating IP...', 'info');
  document.getElementById('metaIp').textContent   = '...';
  document.getElementById('metaPing').textContent = '...';

  const current = state.proxy?.[0];
  let next = state.scanCache.find(s => s.ping !== null && s.host !== current);
  if (!next) {
    next = { host: SERVERS[1][0], port: SERVERS[1][1], ping: null };
  }

  await sleep(600);
  state.proxy = [next.host, next.port];
  document.getElementById('metaServer').textContent = `${next.host}:${next.port}`;
  document.getElementById('metaPing').textContent   = next.ping ? `${next.ping}ms` : 'вЂ”';
  stopTimer(); startTimer();
  fetchMyIp();
  log(`IP rotated в†’ ${next.host}:${next.port}`, 'ok');
}

// в”Ђв”Ђ Scan servers в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
async function scanServers() {
  log('scanning servers...', 'info');
  document.getElementById('serverCount').textContent = '...';

  const list = document.getElementById('serverList');
  list.innerHTML = '';

  state.scanCache = [];
  let online = 0;

  // We can't TCP-ping from browser, so we do HTTP fetch with short timeout
  const results = await Promise.all(SERVERS.map(([h,p]) => pingHttp(h,p)));

  results.forEach(({ host, port, ms }, i) => {
    state.scanCache.push({ host, port, ping: ms });
    if (ms !== null) online++;

    const item = document.createElement('div');
    item.className = 'server-item';
    if (state.proxy && host === state.proxy[0]) item.classList.add('selected');

    let dotCls = 'dead';
    let pingTxt = 'offline';
    if (ms !== null) {
      pingTxt = ms + 'ms';
      dotCls = ms < 200 ? 'fast' : ms < 400 ? 'med' : 'slow';
    }

    const isActive = state.proxy && host === state.proxy[0];
    item.innerHTML = `
      <div class="server-dot ${dotCls}"></div>
      <div class="server-host">${host}:${port}</div>
      <div class="server-ping">${pingTxt}</div>
      <div class="server-active-mark">${isActive ? 'в—†' : ''}</div>
    `;
    item.onclick = () => selectServer(host, port, ms);
    list.appendChild(item);
  });

  // Sort by ping
  state.scanCache.sort((a,b) => {
    if (a.ping === null && b.ping === null) return 0;
    if (a.ping === null) return 1;
    if (b.ping === null) return -1;
    return a.ping - b.ping;
  });

  document.getElementById('serverCount').textContent = `${online}/${SERVERS.length} online`;
  log(`scan complete: ${online}/${SERVERS.length} online`, 'ok');
}

async function pingHttp(host, port) {
  const t0 = performance.now();
  try {
    await Promise.race([
      fetch(`http://${host}:${port}`, { mode:'no-cors', cache:'no-store' }),
      new Promise((_,r) => setTimeout(() => r(new Error('timeout')), 2500))
    ]);
    return { host, port, ms: Math.round(performance.now() - t0) };
  } catch(e) {
    return { host, port, ms: null };
  }
}

function selectServer(host, port, ping) {
  if (!state.connected) {
    state.proxy = [host, port];
    log(`server selected: ${host}:${port}`, 'info');
  } else {
    state.proxy = [host, port];
    document.getElementById('metaServer').textContent = `${host}:${port}`;
    document.getElementById('metaPing').textContent   = ping ? `${ping}ms` : 'вЂ”';
    stopTimer(); startTimer();
    fetchMyIp();
    log(`switched to ${host}:${port}`, 'ok');
  }
  // refresh marks
  document.querySelectorAll('.server-item').forEach(el => {
    const h = el.querySelector('.server-host')?.textContent?.split(':')[0];
    el.classList.toggle('selected', h === host);
    const mark = el.querySelector('.server-active-mark');
    if (mark) mark.textContent = h === host ? 'в—†' : '';
  });
}

// в”Ђв”Ђ Fetch real IP в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
async function fetchMyIp() {
  const el = document.getElementById('metaIp');
  el.textContent = '...';
  el.classList.add('loading');
  try {
    const r = await Promise.race([
      fetch('https://api.ipify.org?format=json'),
      new Promise((_,r) => setTimeout(() => r(new Error('timeout')), 5000))
    ]);
    const d = await r.json();
    el.textContent = d.ip;
    log(`IP: ${d.ip}`, 'ok');
  } catch {
    el.textContent = 'unavailable';
    log('IP fetch failed', 'err');
  }
  el.classList.remove('loading');
}

async function showMyIp() {
  log('fetching IP...', 'info');
  await fetchMyIp();
}

// в”Ђв”Ђ Helpers в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// в”Ђв”Ђ Init в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
log('system ready', 'ok');
log('press [ CONNECT ] to start', 'info');
scanServers();
</script>
